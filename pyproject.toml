[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechlab"
version = "0.3.0"
description = "An LLM research agent for speech science: a tool-calling assistant grounded in locally measured acoustics (F0, formants, jitter/shimmer, HNR)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SpeechLab contributors" }]
requires-python = ">=3.10"
keywords = ["speech", "phonetics", "acoustics", "voice", "research", "agent", "llm"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.0",
]

[project.optional-dependencies]
soundfile = ["soundfile>=0.12"]
dev = ["pytest>=7", "ruff>=0.4"]
web = ["flask>=3.0"]
bench = ["praat-parselmouth>=0.4", "matplotlib>=3.7"]

[project.scripts]
speechlab = "speechlab.cli:main"

[project.urls]
Homepage = "https://github.com/zanezhao0708/speechlab"
Issues = "https://github.com/zanezhao0708/speechlab/issues"

[tool.setuptools.packages.find]
include = ["speechlab*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
