[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechlab"
version = "0.1.0"
description = "A toolkit and LLM agent for speech-science research: acoustics, corpus tools and a tool-using research assistant."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SpeechLab contributors" }]
requires-python = ">=3.10"
keywords = ["speech", "phonetics", "acoustics", "voice", "research", "agent"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.0",
]

[project.optional-dependencies]
soundfile = ["soundfile>=0.12"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
speechlab = "speechlab.cli:main"

[project.urls]
Homepage = "https://github.com/speechlab/speechlab"

[tool.setuptools.packages.find]
include = ["speechlab*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
